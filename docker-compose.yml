services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: food-delivery-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: food_delivery
      MYSQL_USER: ${MYSQL_USER:-food_delivery}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-food_delivery}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - food-delivery-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: food-delivery-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - food-delivery-network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: food-delivery-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "6300:6300"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/food_delivery?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-food_delivery}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-food_delivery}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-fooddelivery2024secretkeyforsecuritypurposemustbe256bits}
      WECHAT_APPID: ${WECHAT_APPID:-your-appid}
      WECHAT_SECRET: ${WECHAT_SECRET:-your-secret}
    volumes:
      - coverage_data:/app/coverage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - food-delivery-network

  # 前端管理后台
  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: food-delivery-admin
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - food-delivery-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  coverage_data:
    driver: local

networks:
  food-delivery-network:
    driver: bridge
